name: CI/CD Model Retraining

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  retrain-and-dockerize:
    runs-on: ubuntu-latest

    steps:
    - name: Run actions/checkout@v3
      uses: actions/checkout@v4

    - name: Set up Python 3.12.7
      uses: actions/setup-python@v5
      with:
        python-version: '3.12.7'
        
    - name: Check Env
      run: python --version

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mlflow==2.19.0 dagshub pandas scikit-learn matplotlib seaborn

    - name: Run mlflow project
      run: |
        cd MLProject
        mlflow run . --env-manager local
        
    - name: Get latest MLflow run_id
      id: get_run_id
      run: |
        cd MLProject
        RUN_ID=$(ls mlruns/0 | grep -v meta.yaml | head -n 1)
        echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
        
    - name: Install Python dependencies
      run: echo "Library tambahan sudah terinstal di tahap sebelumnya"

    - name: Upload to GitHub
      uses: actions/upload-artifact@v4
      with:
        name: mlflow-artifacts
        path: MLProject/mlruns/

    - name: Build Docker Model
      run: |
        cd MLProject
        mlflow models build-docker -m "mlruns/0/${{ env.RUN_ID }}/artifacts/model" -n "${{ secrets.DOCKER_USERNAME }}/workflow-ci:latest"
        
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    - name: Tag Docker Image
      run: |
        docker tag "${{ secrets.DOCKER_USERNAME }}/workflow-ci:latest" "${{ secrets.DOCKER_USERNAME }}/workflow-ci:v1.0"
        
    - name: Push Docker Image
      run: |
        docker push "${{ secrets.DOCKER_USERNAME }}/workflow-ci:latest"
        docker push "${{ secrets.DOCKER_USERNAME }}/workflow-ci:v1.0"
